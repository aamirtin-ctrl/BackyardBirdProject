[project]
name = "ig-poster"
version = "0.1.0"
description = "Daily Instagram Reels auto-poster for documentary clips"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
    "yt-dlp>=2025.1.15",
    "requests>=2.32.0",
    "boto3>=1.35.0",
    "pillow>=10.4.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
